name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: python -m pip install -e ".[dev,fast]"
      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .
      # The tests use generated videos and a toy encoder: no model download, no network.
      - name: Tests
        run: python -m pytest -q
      # every number in README.md and docs/RESULTS.md comes from results/*.json
      - name: Result tables
        run: python scripts/tables.py --check

  docker:
    # the image of docs/TUTORIAL.md builds, and the tool inside it starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t whenframe .
      - run: docker run --rm whenframe --help
      - run: docker run --rm --entrypoint python whenframe -c "import openvino, whenframe; print(openvino.__version__)"
