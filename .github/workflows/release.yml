name: Release

# A tag v0.1.0 publishes version 0.1.0: the package on PyPI, the image on ghcr.io and a
# GitHub release with the changelog. docs/RELEASING.md says what has to be set up first.

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write  # the GitHub release
      id-token: write  # PyPI's trusted publishing: no token stored anywhere
      packages: write  # the image on ghcr.io
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: The tag is the package's version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' whenframe/__init__.py)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, package $version"; exit 1; }
          grep -q "^## $version$" CHANGELOG.md || { echo "no changelog entry for $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Publish on PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Image on ghcr.io
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "$image:$VERSION" -t "$image:latest" .
          docker run --rm "$image:$VERSION" --version
          docker push "$image:$VERSION"
          docker push "$image:latest"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          awk -v v="## $VERSION" '$0 == v {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "whenframe $VERSION" --notes-file notes.md
