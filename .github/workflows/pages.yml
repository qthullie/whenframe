name: Site

# Publishes site/ to GitHub Pages, with small copies of the three films it searches, made
# here from Blender's downloads (scripts/site_videos.sh) and kept in the Actions cache, out
# of git. Pages has to be turned on once, with "GitHub Actions" as its source (Settings,
# Pages); until then configure-pages stops with "Get Pages site failed". While the
# repository is private this job is skipped.
on:
  push:
    branches: [main]
    paths: ["site/**", "scripts/site_videos.sh", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - id: videos
        uses: actions/cache@v5
        with:
          path: site/videos
          key: site-videos-${{ hashFiles('scripts/site_videos.sh') }}
      - if: steps.videos.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          scripts/site_videos.sh site/videos "$RUNNER_TEMP/films"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
