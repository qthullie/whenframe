name: Site

# Publishes site/ to GitHub Pages, with the videos and photos it searches (site/library.json),
# downloaded here from YFCC100M's public copy and made smaller (scripts/site_media.py), kept in
# the Actions cache, out of git. Pages has to be turned on once, with "GitHub Actions" as its source (Settings,
# Pages); until then configure-pages stops with "Get Pages site failed". While the
# repository is private this job is skipped.
on:
  push:
    branches: [main]
    paths: ["site/**", "scripts/site_media.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - id: media
        uses: actions/cache@v5
        with:
          path: site/media
          key: site-media-${{ hashFiles('site/library.json', 'scripts/site_media.py') }}
      - if: steps.media.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          python3 -m pip install --quiet pillow
          python3 scripts/site_media.py site/media
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
