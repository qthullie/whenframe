[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whenframe"
version = "0.1.0"
description = "Find the moment you are looking for in your own videos, on your own machine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "onnxruntime>=1.17", "tokenizers>=0.15"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "matplotlib>=3.7"]

[project.scripts]
whenframe = "whenframe.cli:main"

[tool.setuptools.packages.find]
include = ["whenframe*"]

[tool.setuptools.package-data]
"whenframe.data" = ["*.npy", "NOTICE"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
