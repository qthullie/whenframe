[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whenframe"
dynamic = ["version"]
description = "Find the moment you are looking for in your own videos, on your own machine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "qthullie" }]
keywords = ["video search", "moment retrieval", "self-hosted", "siglip", "clap", "whisper"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = ["numpy>=1.24", "onnxruntime>=1.17", "tokenizers>=0.15"]

[project.urls]
Homepage = "https://github.com/qthullie/whenframe"
Documentation = "https://github.com/qthullie/whenframe/blob/main/docs/TUTORIAL.md"
Demo = "https://qthullie.github.io/whenframe/"
Changelog = "https://github.com/qthullie/whenframe/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# OpenVINO runs the image encoder, five times faster where the processor computes in bfloat16 (docs/RESULTS.md)
fast = ["openvino>=2025.0"]
# Whisper on the CPU, to search what is said (whenframe index --speech base)
speech = ["faster-whisper>=1.1"]
dev = ["pytest>=7", "ruff>=0.5", "matplotlib>=3.7", "pyarrow>=14", "onnx>=1.15"]

[project.scripts]
whenframe = "whenframe.cli:main"

[tool.setuptools.dynamic]
version = { attr = "whenframe.__version__" }

[tool.setuptools.packages.find]
include = ["whenframe*"]

[tool.setuptools.package-data]
"whenframe.data" = ["*.npy", "*.onnx", "NOTICE"]
whenframe = ["web/*.html"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
